[project]
name = "ssm3d"
version = "0.1.0"
description = "Large-scale 3D reconstruction using SSM attention (Mamba-3 attention swapped into Depth-Anything-3)"
authors = [
    { name = "Masahiro Ogawa", email = "m-ogawa@sensyn-robotics.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2",
    "torchvision",
    "einops",
    "numpy<2",
    "pillow",
    "opencv-python",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "pycocotools",
    "requests",
    "tqdm",
    "py7zr",
    "omegaconf",
    "addict",
    "safetensors",
    "huggingface-hub",
    "imageio",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist",
]

[project.scripts]
ssm3d-demo = "ssm3d.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssm3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project]
name = "mamba3_attn"
version = "0.1.0"
description = "Large-scale 3D reconstruction using SSM attention (Mamba-3 attention swapped into Depth-Anything-3)"
authors = [
    { name = "Masahiro Ogawa", email = "m-ogawa@sensyn-robotics.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2",
    "torchvision",
    "einops",
    "numpy<2",
    "pillow",
    "opencv-python",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "pycocotools",
    "requests",
    "tqdm",
    "py7zr",
    "omegaconf",
    "addict",
    "safetensors",
    "huggingface-hub",
    "imageio",
    "plyfile>=1.1.3",
    "moviepy>=2.2.1",
    "evo>=1.36.3",
    "pycolmap>=4.0.3",
    "schedulefree>=1.4.1",
    "open3d>=0.19.0",
    "transformers>=5.6.2",
    "plotly>=6.7.0",
    "trimesh>=4.12.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist",
]

[project.scripts]
mamba3-attn-demo = "mamba3_attn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mamba3_attn", "src/mamba3_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]
